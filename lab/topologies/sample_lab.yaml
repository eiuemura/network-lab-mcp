# Sample topology used to validate Network Lab MCP.
#
# Topology holds only safe logical data (devices, device type, links) --
# this file is exposed to Claude via get_active_topology(). Private device
# connection data (address/transport/port/username/password) lives in a
# separate access-info definition instead; see lab/access-info/sample_lab.yaml.
# The two files share a basename purely as a sample convenience -- filenames
# never associate a topology with an access-info definition (see
# "Known limitations" in README.md).
#
# This file exists to validate YAML loading, MCP structured output, and
# device-name/session-name mapping -- not to be a real lab.

name: sample_lab

description: >
  Sample topology used to validate Network Lab MCP. Safe logical data only;
  see lab/access-info/sample_lab.yaml for the matching (independent) sample
  access information.

devices:
  R1:
    type: iosxr

  R2:
    type: iosxr

links: []
