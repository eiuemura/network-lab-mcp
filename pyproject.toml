[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-lab-mcp"
version = "0.2.0"
description = "An AI Network Engineer Workspace that gives MCP-capable AI clients structured lab context and controlled, observable terminal access to real network labs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eitaro Uemura" }]
license = { text = "GNU General Public License v3.0" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "mcp>=2.2,<3",
    "pyyaml>=6,<7",
    "prompt_toolkit>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
network-lab-mcp = "network_lab_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "real_lab: requires real lab hardware (IOS XR/IOS XE/classic IOS); opt-in via NETWORK_LAB_REAL_TESTS=1 (skipped by default).",
]
