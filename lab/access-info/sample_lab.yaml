# Sample access-info definition used to validate Network Lab MCP.
#
# access-info holds private device connection data. It is never exposed by
# any MCP tool -- only get_active_topology()'s safe logical topology is.
# This file's basename matching lab/topologies/sample_lab.yaml is a sample
# convenience only; the two are independent definitions, never associated
# by filename (see "Known limitations" in README.md). terminal_open()
# resolves a device's access information by searching every committed
# lab/access-info/*.yaml definition for an exact device ID match.
#
# IMPORTANT: the addresses below use the RFC 5737 documentation-only range
# (192.0.2.0/24, "TEST-NET-1"). They are not reachable and must not be
# treated as connectivity targets.

name: sample_lab

devices:
  R1:
    type: iosxr
    address: 192.0.2.11
    transport: ssh
    port: 22
    username: example-user
    password: example-password

  R2:
    type: iosxr
    address: 192.0.2.12
    transport: ssh
    port: 22
    username: example-user
    password: example-password
